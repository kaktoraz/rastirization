name: Reproducible experiment

on:
  push:
    branches:
      - arena/01a1074a-rastirization
    # Documentation-only commits do not need to spend several minutes rerunning
    # the numerical experiment. Source, data and analysis changes do.
    paths:
      - "src/**"
      - "data/**"
      - "analysis.py"
      - "visualize.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reproducible-experiment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Grayscale, colour and paired experiment
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python for tables and plots
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis and document dependencies
        run: python -m pip install --disable-pip-version-check numpy matplotlib pillow python-docx python-pptx

      - name: Format Rust source
        run: cargo fmt --all

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run deterministic six-scene grayscale benchmark
        run: |
          mkdir -p benchmark-artifact/results/logs
          ./target/release/smoothing_project bench \
            -d data/clean -o benchmark-artifact/results \
            --noise 5,10,15,20,30,40 --save-sigma 20 --seed 12345 \
            | tee benchmark-artifact/results/logs/bench.log

      - name: Run 30 paired independent seeds
        run: |
          ./target/release/smoothing_project stats \
            -d data/clean -o benchmark-artifact/results \
            --noise 5,10,15,20,30,40 --runs 30 --seed 12345 \
            | tee benchmark-artifact/results/logs/significance.log

      - name: Calibrate only on sigma 20 and 30
        run: |
          ./target/release/smoothing_project tune \
            -d data/clean -o benchmark-artifact/results/tables/calibration.csv \
            --noise 20,30 --seed 12345 \
            --configs "2.0,0.55,2.8,1.0,5,2;2.0,0.7,3.2,1.2,5,2;2.0,0.85,3.6,1.3,5,2;1.5,0.7,3.2,1.2,5,2;2.5,0.7,3.2,1.2,5,2" \
            | tee benchmark-artifact/results/logs/calibration.log

      - name: Run deterministic colour YCbCr benchmark
        run: |
          mkdir -p benchmark-artifact/results/color/logs
          ./target/release/smoothing_project bench --rgb \
            -d data/color -o benchmark-artifact/results/color \
            --noise 5,10,15,20,30,40 --save-sigma 20 --seed 12345 \
            | tee benchmark-artifact/results/color/logs/color_bench.log

      - name: Generate result-derived tables, figures and documents
        run: |
          python analysis.py --root benchmark-artifact/results
          python visualize.py --root benchmark-artifact/results --sigma 20
          python analysis.py --root benchmark-artifact/results/color --color
          ACSF_RESULTS_ROOT=benchmark-artifact/results python docs/build_report.py
          ACSF_RESULTS_ROOT=benchmark-artifact/results python docs/build_slides.py

      - name: Save reproducible results and source formatting in the branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p results/logs results/color
          cp benchmark-artifact/results/tables/results.csv results/tables/results.csv
          cp benchmark-artifact/results/tables/calibration.csv results/tables/calibration.csv
          cp benchmark-artifact/results/tables/significance_runs.csv results/tables/significance_runs.csv
          cp benchmark-artifact/results/tables/significance_summary.md results/tables/significance_summary.md
          cp benchmark-artifact/results/tables/summary.json results/tables/summary.json
          cp benchmark-artifact/results/tables/table_*.md results/tables/
          cp benchmark-artifact/results/logs/bench.log results/logs/bench.log
          cp benchmark-artifact/results/logs/calibration.log results/logs/calibration.log
          cp benchmark-artifact/results/logs/significance.log results/logs/significance.log
          cp -r benchmark-artifact/results/plots/. results/plots/
          rm -rf results/color/tables results/color/plots results/color/logs
          cp -r benchmark-artifact/results/color/tables results/color/tables
          cp -r benchmark-artifact/results/color/plots results/color/plots
          cp -r benchmark-artifact/results/color/logs results/color/logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/*.rs results results/color \
            docs/Отчёт_Сглаживание_изображений.docx \
            docs/Презентация_Сглаживание_изображений.pptx \
            docs/Речь_для_выступления.md
          if ! git diff --cached --quiet; then
            git commit -m "Обновить полный воспроизводимый эксперимент [skip ci]"
            git push origin "HEAD:refs/heads/${BRANCH}"
          fi
