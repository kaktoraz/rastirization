name: Reproducible benchmark

on:
  push:
    branches:
      - arena/01a1074a-rastirization
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    name: Full grayscale benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run deterministic benchmark
        run: |
          mkdir -p benchmark-artifact
          ./target/release/smoothing_project bench \
            -d data/clean -o benchmark-artifact/results \
            --noise 10,20,25,30,40 --save-sigma 25 \
            | tee benchmark-artifact/bench.log

      - name: Save reproducible tables in the branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          cp benchmark-artifact/results/tables/results.csv results/tables/results.csv
          cp benchmark-artifact/bench.log results/logs/bench.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/tables/results.csv results/logs/bench.log
          if ! git diff --cached --quiet; then
            git commit -m "Обновить результаты воспроизводимого бенчмарка [skip ci]"
            git push origin "HEAD:refs/heads/${BRANCH}"
          fi
